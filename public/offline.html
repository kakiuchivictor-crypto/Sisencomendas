<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sem conexão — SisEncomendas</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f4f5fa;
        color: #1c1d2b;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        padding: 24px;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #141521;
          color: #eceefb;
        }
      }
      .card {
        max-width: 380px;
        text-align: center;
      }
      .icon {
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        border-radius: 16px;
        background: #2f3ea3;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .icon svg {
        width: 32px;
        height: 32px;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 24px;
        font-size: 0.9rem;
        line-height: 1.5;
        opacity: 0.75;
      }
      button {
        appearance: none;
        border: none;
        border-radius: 10px;
        background: #2f3ea3;
        color: #fff;
        font-size: 0.9rem;
        font-weight: 600;
        padding: 12px 24px;
        cursor: pointer;
      }
      button:active {
        transform: scale(0.98);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 3l18 18M8.5 8.5A5 5 0 0 0 5 12M12 5c1.7 0 3.3.5 4.6 1.4M19 9a9 9 0 0 1 2 4M2 9a9 9 0 0 1 2.6-3.4" />
          <circle cx="12" cy="18" r="1" fill="white" stroke="none" />
        </svg>
      </div>
      <h1>Sem conexão com a internet</h1>
      <p>Não foi possível carregar esta página. Verifique sua conexão e tente novamente.</p>
      <button onclick="location.reload()">Tentar novamente</button>
    </div>
  </body>
</html>
